
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMarket</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f5;
            color: #222;
        }

        /* Top navigation */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 35px;
            background: white;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 25px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #238636;
            white-space: nowrap;
        }

        .browse {
            color: #333;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .book-add-btn {
            background: #238636;
            color: white;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 7px;
            font-weight: bold;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 650px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 18px;
            border: none;
            background: #f0f2f0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
        }

        .login-btn {
            background: #238636;
            color: white;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 7px;
            font-weight: bold;
            white-space: nowrap;
        }

        .login-btn:hover {
            background: #196c2c;
        }

        /* Main content */
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 30px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin-bottom: 5px;
        }

        .page-heading p {
            color: #777;
        }

        /* Book grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 22px;
        }

        .book-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.13);
        }

        .book-image {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #eeeeee;
            display: block;
        }

        .placeholder {
            height: 220px;
            background: #e9eee9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #238636;
            font-size: 20px;
            font-weight: bold;
        }

        .book-info {
            padding: 15px;
        }

        .book-price {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #238636;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .book-author {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .empty-message {
            color: #777;
            margin-top: 30px;
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 12px;
                gap: 12px;
                flex-wrap: wrap;
            }

            .search-container {
                order: 3;
                flex-basis: 100%;
                max-width: none;
            }

            .container {
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

<!-- Navigation ribbon -->
<nav class="navbar">

    <div class="logo">BookMarket</div>

    <a href="/books" class="browse">Browse</a>

    <div class="search-container">
        <input
                type="text"
                id="searchInput"
                placeholder="Search books or authors..."
                oninput="searchBooks()">
    </div>

    <!-- Show Login button if NOT logged in -->
    <a th:if="${session.loggedInUser == null}" href="/login" class="login-btn">
        Login
    </a>

    <!-- Show User Panel, Add Book (if admin), and Logout if logged in -->
    <div th:if="${session.loggedInUser != null}" style="display: flex; align-items: center; gap: 15px;">

        <!-- Optional: Greeting -->
        <span th:text="${'Hi, ' + session.loggedInUser.username}" style="font-weight: bold; font-size: 14px; color: #333;"></span>

        <!-- Add New Book button  -->
        <a th:if="${session.loggedInUser.role == 'ADMIN'}"
           th:href="@{/books/add}"
           style="background: #007bff; color: white; text-decoration: none; padding: 10px 15px; border-radius: 7px; font-weight: bold; font-size: 14px; white-space: nowrap;">
            Add New Book
        </a>

        <!-- Logout button -->
        <a href="/logout" class="login-btn" style="background: #d73a49;">
            Logout
        </a>
    </div>

</nav>

<!-- Marketplace content -->
<main class="container">

    <div class="page-heading">
        <h1>Discover Books</h1>
        <p>Find your next favorite book.</p>
    </div>

    <div class="book-grid" id="bookGrid">

        <a th:each="book : ${books}"
           th:href="@{/books/{id}(id=${book.id})}"
           class="book-card">

            <!-- Book cover -->
            <img th:if="${book.imageUrl != null and !#strings.isEmpty(book.imageUrl)}"
                 th:src="${book.imageUrl}"
                 th:alt="${book.title}"
                 class="book-image">

            <!-- Placeholder if no image exists -->
            <div th:unless="${book.imageUrl != null and !#strings.isEmpty(book.imageUrl)}"
                 class="placeholder">
                Book Cover
            </div>

            <div class="book-info">

                <div class="book-price"
                     th:text="${book.price != null ? '$' + #numbers.formatDecimal(book.price, 1, 2) : 'Price unavailable'}">
                    $0.00
                </div>

                <div class="book-title"
                     th:text="${book.title}">
                    Book Title
                </div>

                <div class="book-author"
                     th:text="${book.author}">
                    Author
                </div>
            </div>

        </a>

    </div>

    <p class="empty-message"
       th:if="${#lists.isEmpty(books)}">
        No books are currently listed. Check back later!
    </p>

</main>

<script>
    function searchBooks() {

        const searchValue = document
            .getElementById("searchInput")
            .value.toLowerCase();

        const books = document.querySelectorAll(".book-card");

        books.forEach(book => {

            const title = book.querySelector(".book-title")
                .textContent.toLowerCase();

            const author = book.querySelector(".book-author")
                .textContent.toLowerCase();

            if (title.includes(searchValue) ||
                author.includes(searchValue)) {

                book.style.display = "";

            } else {

                book.style.display = "none";

            }

        });
    }
</script>

</body>
</html>
