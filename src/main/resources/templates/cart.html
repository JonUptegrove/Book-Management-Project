<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Checkout Cart</title>
</head>
<body>
<h1>Books in Your Cart</h1>

<a href = "/">
    <button type = "button"> <- Back to Home</button>
</a>

<table th:if="${!cartBooks.isEmpty()}">
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>ISBN</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${cartBooks}">
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.isbn}">ISBN</td>
        <td>
            <form th:action="@{/cart/remove/{id}(id=${book.id})}" method="post">
                <button type="submit">Remove</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- Only show the Clear Cart button if the cart is not empty -->
<div th:if="${!cartBooks.isEmpty()}">
    <form th:action="@{/cart/clear}" method="post" style="margin-top: 15px;">
        <button type="submit" style="background-color: #dc3545; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">Clear Cart</button>
    </form>
</div>

<p th:if="${cartBooks.isEmpty()}">Your cart is currently empty.</p>

<br>
<a th:href="@{/books}">Back to Book Inventory</a>
</body>
</html>
