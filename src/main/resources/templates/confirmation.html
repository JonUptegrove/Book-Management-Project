<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Purchase Confirmation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .confirmation-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 450px;
    }

    .success-icon {
      font-size: 55px;
      color: #28a745;
    }

    h1 {
      color: #333;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    .home-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .home-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

<div class="confirmation-container">

  <div class="success-icon">&#10004;</div>

  <h1>Purchase Successful!</h1>

  <p>
    Thank you for your purchase!
    Your demo order has been completed successfully.
  </p>

  <p>
    This is a portfolio demonstration.
    No actual payment was processed.
  </p>

  <a href="/books" class="home-button">Return to Book Marketplace</a>

</div>

</body>
</html>
