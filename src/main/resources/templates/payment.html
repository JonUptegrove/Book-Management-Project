<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookMarket - Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f5;
            color: #222;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 45px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            color: #238636;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link {
            color: #238636;
            text-decoration: none;
            font-weight: bold;
        }

        .payment-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 25px;
        }

        .payment-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        h1 {
            margin-top: 0;
        }

        .payment-description {
            color: #777;
            margin-bottom: 25px;
        }

        .order-total {
            background: #f0f5f0;
            padding: 20px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .total-price {
            font-size: 24px;
            font-weight: bold;
            color: #238636;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #238636;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .purchase-button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .purchase-button:hover {
            background: #196c2c;
        }

        .demo-message {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 18px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <a href="/books" class="logo">BookMarket</a>

    <a href="/cart" class="back-link">
        Return to Cart
    </a>

</nav>

<main class="payment-container">

    <div class="payment-card">

        <h1>Payment Information</h1>

        <p class="payment-description">
            Enter your demonstration payment information to complete your order.
        </p>

        <div class="order-total">

            <span>Order Total</span>

            <span class="total-price"
                  th:text="${'$' + #numbers.formatDecimal(orderTotal, 1, 2)}">
                $0.00
            </span>

        </div>

        <form th:action="@{/cart/purchase}" method="post">

            <div class="form-group">

                <label for="cardholderName">Cardholder Name</label>

                <input type="text"
                       id="cardholderName"
                       name="cardholderName"
                       placeholder="John Smith"
                       maxlength="100"
                       autocomplete="off"
                       required>

            </div>

            <div class="form-group">

                <label for="cardNumber">Demo Card Number</label>

                <input type="text"
                       id="cardNumber"
                       name="cardNumber"
                       placeholder="1234 5678 9012 3456"
                       inputmode="numeric"
                       pattern="[0-9 ]{13,23}"
                       maxlength="23"
                       autocomplete="off"
                       required>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label for="expiration">Expiration Date</label>

                    <input type="text"
                           id="expiration"
                           name="expiration"
                           placeholder="MM/YY"
                           pattern="(0[1-9]|1[0-2])/[0-9]{2}"
                           maxlength="5"
                           autocomplete="off"
                           required>

                </div>

                <div class="form-group">

                    <label for="cvv">Demo Security Code</label>

                    <input type="text"
                           id="cvv"
                           name="cvv"
                           placeholder="123"
                           inputmode="numeric"
                           pattern="[0-9]{3,4}"
                           maxlength="4"
                           autocomplete="off"
                           required>

                </div>

            </div>

            <p class="demo-message">
                Portfolio demonstration only. Do not enter real payment information.
                No actual payment will be processed.
            </p>

            <button type="submit" class="purchase-button">
                Complete Purchase
            </button>

        </form>

    </div>

</main>
<script>
    // Card number: XXXX XXXX XXXX XXXX
    const cardNumber = document.getElementById("cardNumber");

    cardNumber.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        value = value.substring(0, 16);

        this.value = value.replace(/(\d{4})(?=\d)/g, "$1 ");
    });


    // Expiration date: MM/YY
    const expiration = document.getElementById("expiration");

    expiration.addEventListener("input", function () {
        let value = this.value.replace(/\D/g, "");

        value = value.substring(0, 4);

        if (value.length >= 3) {
            value = value.substring(0, 2) + "/" + value.substring(2);
        }

        this.value = value;
    });


    // CVV: numbers only, maximum 4 digits
    const cvv = document.getElementById("cvv");

    cvv.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").substring(0, 4);
    });


    // Cardholder name: letters and spaces only
    const cardholderName = document.getElementById("cardholderName");

    cardholderName.addEventListener("input", function () {
        this.value = this.value.replace(/[^a-zA-Z\s'-]/g, "");
    });
</script>
</body>
</html>
